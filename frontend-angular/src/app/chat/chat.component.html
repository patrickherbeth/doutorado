<div class="layout">
    <aside class="sidebar">

        <!-- 🔥 HEADER COM LOGO -->
        <div class="sidebar-header">

            <div class="logo-container">
                <img src="assets/tjmg-logo.png" alt="TJMG">
                <span class="logo-text">KELLER TJMG</span>
            </div>

            <button class="new-chat-btn" type="button">
                Nova pesquisa
            </button>
        </div>

        <div class="sidebar-history">
            <div class="sidebar-title">Pesquisas</div>

            <button
                    type="button"
                    class="history-item"
                    *ngFor="let item of historico"
                    (click)="repetirPesquisa(item)">

                <div class="history-title">{{ item.titulo }}</div>
                <div class="history-date">
                    {{ item.data | date:'dd/MM/yyyy HH:mm' }}
                </div>
            </button>

            <div class="history-empty" *ngIf="historico.length === 0">
                Nenhuma pesquisa ainda.
            </div>
        </div>
    </aside>

    <main class="main">
        <div class="messages">

            <div
                    class="message-row"
                    *ngFor="let msg of mensagens"
                    [ngClass]="msg.tipo === 'user' ? 'row-user' : 'row-assistant'">

                <div class="avatar" [ngClass]="msg.tipo">
                    {{ msg.tipo === 'user' ? 'P' : 'K' }}
                </div>

                <div class="message-card">

                    <div *ngIf="msg.texto" class="plain-text">
                        {{ msg.texto }}
                    </div>

                    <ng-container *ngIf="msg.resposta">

                        <div class="response-block">
                            <div class="response-title">Pergunta</div>
                            <div class="response-text">
                                {{ msg.resposta.pergunta }}
                            </div>
                        </div>

                        <div class="response-block">
                            <div class="response-title">Subfatos</div>
                            <div class="chip-list">
                                <div class="chip" *ngFor="let sf of msg.resposta.subfatos">
                                    {{ sf }}
                                </div>
                            </div>
                        </div>

                        <div class="response-block">
                            <div class="response-title">Resultados</div>

                            <div class="result-card" *ngFor="let item of msg.resposta.ranking">

                                <div class="result-top">
                                    <div class="result-id">
                                        Documento {{ item.id }}
                                    </div>
                                    <div class="result-score">
                                        Score {{ item.score }}
                                    </div>
                                </div>

                                <div class="result-text">
                                    {{ item.texto }}
                                </div>

                                <div class="result-subfacts">
                                    <div class="result-subfact" *ngFor="let sf of item.subfatos">
                                        {{ sf }}
                                    </div>
                                </div>

                            </div>
                        </div>

                    </ng-container>

                </div>
            </div>

            <div class="loading" *ngIf="carregando">
                Consultando endpoint...
            </div>
        </div>

        <!-- 🔥 INPUT ESTILO CHATGPT -->
        <div class="composer-wrapper">
            <div class="composer">

                <textarea
                        [(ngModel)]="pergunta"
                        (keydown)="enviarComEnter($event)"
                        placeholder="Envie uma consulta jurídica"
                        rows="1">
                </textarea>

                <button
                        type="button"
                        class="send-btn"
                        (click)="enviarPergunta()"
                        [disabled]="carregando || !pergunta.trim()">
                    ↑
                </button>

            </div>
        </div>

    </main>
</div>
